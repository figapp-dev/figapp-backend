# Daily catch-up: POST /internal/billing/collect on the already-deployed API.
# Does not deploy. Cron is UTC. First Direct Debit still comes from the mandate webhook.
name: Billing collect

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect due licence payments
        env:
          FIGAPP_API_URL: ${{ secrets.FIGAPP_API_URL }}
          BILLING_CRON_SECRET: ${{ secrets.BILLING_CRON_SECRET }}
        run: |
          set -eu
          if [ -z "${FIGAPP_API_URL:-}" ] || [ -z "${BILLING_CRON_SECRET:-}" ]; then
            echo "Missing FIGAPP_API_URL or BILLING_CRON_SECRET repo secrets."
            exit 1
          fi
          curl -fsS -X POST "${FIGAPP_API_URL%/}/internal/billing/collect" \
            -H "x-billing-cron-secret: ${BILLING_CRON_SECRET}" \
            -H "Content-Type: application/json"
