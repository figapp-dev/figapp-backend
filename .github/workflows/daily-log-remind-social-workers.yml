# Weekly: overdue daily-log reminders for social workers.
# POST /internal/daily-logs/remind-social-workers on the deployed API.
# Cron is UTC (Monday 09:00 ≈ 09:00/10:00 UK depending on BST).
name: Daily log remind social workers

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remind social workers
        env:
          FIGAPP_API_URL: ${{ secrets.FIGAPP_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BILLING_CRON_SECRET: ${{ secrets.BILLING_CRON_SECRET }}
        run: |
          set -eu
          SECRET="${CRON_SECRET:-${BILLING_CRON_SECRET:-}}"
          if [ -z "${FIGAPP_API_URL:-}" ] || [ -z "${SECRET}" ]; then
            echo "Missing FIGAPP_API_URL or CRON_SECRET/BILLING_CRON_SECRET repo secrets."
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            "${FIGAPP_API_URL%/}/internal/daily-logs/remind-social-workers" \
            -H "x-cron-secret: ${SECRET}"
