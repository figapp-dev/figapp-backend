# Railway: Nixpacks already runs `npm ci` in the install phase.
# Do NOT put `npm ci` in buildCommand — a second install causes
# EBUSY on node_modules/.cache under NODE_ENV=production.
#
# Env vars (Railway Variables — never commit secrets):
#   SUPABASE_URL
#   SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_SERVICE_ROLE_KEY (billing writes / webhooks)
#   GOCARDLESS_ACCESS_TOKEN / GOCARDLESS_WEBHOOK_SECRET / GOCARDLESS_ENV
#   BILLING_CRON_SECRET — Railway Cron POST /internal/billing/collect
#   PORT is injected by Railway

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
